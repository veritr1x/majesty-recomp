# game.toml - everything the kit needs to know about Majesty Gold HD (the
# 2018 GOG release, offline installer 1.5.2.28) that is not derivable from the
# binary. The installer ships two executables; this config pins the DirectDraw
# one, "MajestyHD - Old.exe" (Majesty HD 1.5.1.2, 2011), because the kit
# models DirectDraw and fixed-function Direct3D and the main MajestyHD.exe
# renders through Direct3D 9. See docs/analysis.md.
#
# Addresses are guest addresses in the pinned executable. The [hooks] values
# are sentinels: they point into the zero-filled section padding after .rsrc
# (0x00725d18-0x00725fff; the section is mapped to 0x00726000), which the
# game never references, so the kit's hooks compile and never fire. Each one
# is annotated with why this game has no site for it.

[game]
id = "majesty"
name = "Majesty Gold HD"
app_name = "MajestyRecomp"
bundle_id = "dev.recompkit.majesty"
executable = "MajestyHD - Old.exe"
sha256 = "654365fd1bdefa6d7f2349d162869f255388fadcb1bb8db9f7db2f3468dd5542"
image_base = 0x00400000
entry_point = 0x0064d96d
guest_root = 'C:\GOG Games\Majesty Gold HD'
# Where a developer checkout finds the game, relative to the repository root.
# tools/setup.py links your installation here; an innoextract of the GOG
# installer placed here directly is accepted too.
developer_exe = "original/gog/MajestyHD - Old.exe"

[translate]
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root. tools/analyze.py exports them.
listings = "analysis/decompiled/MajestyHD - Old.exe"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# The kit's translator wants a visual-phase counter; this game has none that
# has been audited. Sentinel, and no reads are rewritten.
animation_counter = 0x00725e00
volatile_reads = []

[hooks]
# Every address here is a sentinel: the kit's hooks are shaped by the game the
# kit began with, and this game gives them nothing to attach to.
# runtime/kernel32.cpp native_frame_clock: GetTickCount return addresses of
# that game's draw-loop waits. This game paces its main loop (FUN_0049ac60)
# on timeGetTime, not GetTickCount, so the pacing hook has no site; the app
# runs at the display's rate without it. Pinning the clock in 16 ms steps
# still busy-waits there (see docs/analysis.md); 33 ms and up run.
frame_clock_begin = 0x00725e10
frame_clock_wait = 0x00725e14
frame_clock_wait_clamp = 0x00725e18
frame_clock_clamp_deadline = 0x00725e20
frame_clock_wait_deadline = 0x00725e24
# dx/ddraw.cpp: mouse-pointer surface globals, for a host-drawn pointer. This
# game composes its own cursor into the frame it presents; nothing to hook.
cursor_surface_ptrs = [0x00725e30, 0x00725e34]
# host/input_gate.cpp: a DirectInput mouse device and its vtable. This game
# reads the mouse through user32 (GetCursorPos, GetAsyncKeyState), not
# DirectInput, so these will never be real.
mouse_vtable = 0x00725e40
mouse_device_ptr = 0x00725e44
mouse_device_right = 0x00725e48
# host/smoke_main.cpp: the camera record the smoke script inspects. Not
# identified; the smoke scripts here judge frames, not the camera.
camera = 0x00725e50

[mods]
# The mod runtime's Populous integrations hook Populous routines by address;
# this game has none of them.
builtin = "none"

[settings]
# The F10 page's rows. The renderer rows (Rendering, UI scale, Wide view,
# Resolution, Frame limit, Textures, World filtering) belong to Populous's
# Direct3D renderer and frame loop and change nothing in this 2D game.
rows = ["window", "performance_overlay", "controls"]

[controls]
# What a tablet player gets without a keyboard. Majesty is a mouse game: the
# pointer does nearly everything, and the only keys measured to do anything
# here are the arrows, Return, Escape and the two modifiers the game polls.
#
# Both halves show by default. The pad carries play; the keys half stays up
# because the UI's own accelerators are data, not code - FUN_00545db0 formats
# a control's key as "<letter> + CONTROL/SHIFT/ALT" from the UIData records,
# so letter hotkeys exist in this game that the listings here cannot
# enumerate, and only a keyboard reaches them. The picker switches to "pad"
# alone for an uncluttered map.
default_layout = "pad+keys"
pad = "mapped"

[controls.mapped]
# Camera. Held arrow keys pan the view (measured: 95% of the map moved after
# 1.5 s of RIGHT, and again after LEFT and UP; docs/analysis.md "how the
# camera moves, measured"). "arrows" holds the key while the stick is
# deflected, which is what the game's scroll ramp (FUN_00440500 times it over
# a second) wants; "scroll" taps the key once per pan step and never ramps.
left_stick = "arrows"
dpad = "arrows"
# The pointer. This is the game's real interface: click to select, click the
# minimap to jump the camera (97% of the map moved), drag nothing.
right_stick = "cursor"
# Points per second at full deflection, below the 900 default. The game polls
# its mouse buttons once per presented frame and presents at about 16 fps on
# the iPad (3917 presents in 238 s), so 900 pt/s steps the cursor ~56 points
# between polls - too coarse for the sidebar's small buttons. 700 pt/s is
# ~44, and the deflection-squared curve keeps fine aim near centre.
cursor_speed = 700
# Buttons. The game polls exactly two mouse buttons, GetKeyState(VK_LBUTTON)
# and GetKeyState(VK_RBUTTON) (FUN_004f6590), so left and right are all the
# mouse it has.
cross = "mouse_left"     # select a building, unit, flag or UI control
circle = "mouse_right"   # deselect; the measured effect of a right click
square = "key:Return"    # ACCEPT/OK on every dialog, and skips the movies
triangle = "action:system_keyboard"  # the player's name and save names
# The two modifiers the game reads, on the shoulders so they can be held
# while the other thumb clicks: GetKeyState(0x11) control (FUN_004f6210) and
# GetKeyState(0x10) shift (FUN_004f61b0). Control is the one documented
# click modifier: "Hold the control key and click to put the selected item
# into the mini view."
l1 = "key:LCtrl"
r1 = "key:LShift"
# Nothing to give the triggers or the stick clicks. This game handles no
# WM_MOUSEWHEEL (no 0x20a in any decompiled function) and never polls a
# middle button, so the kit's mouse_middle and wheel_up/down defaults are
# dead here; the wheel-button drag was measured to do nothing.
l2 = "none"
r2 = "none"
l3 = "none"
r3 = "none"
start = "key:Escape"       # in-quest Options: Save Game, Load Game, Quit
select = "action:settings"  # the kit's own page, the F10 the keypad sent
ps = "action:edit_layout"   # move the pad off the sidebar and minimap

[launcher]
# The launcher (kit host/launcher/): what it calls the game, the folder names
# and store ids it looks for, where to buy it, and the headroom an import
# leaves free.
title = "Majesty Gold HD"
install_names = ["Majesty Gold HD", "Majesty HD", "Majesty"]
gog_ids = ["1423481910"]  # the goggame-1423481910.info in the supported install
# The GOG release is the one whose executable the pin matches.
store = "https://www.gog.com/game/majesty_gold_hd"
# Steam sells the game too; its executable is not checked against the pin,
# so a Steam install is found and then reported if it differs.
steam_ids = ["25990"]
min_free_mb = 800

[setup]
# tools/setup.py: what a supported installation must contain. No annotation
# metadata exists for this executable; tools/analyze.py runs Ghidra's own
# analysis instead of importing one.
required_dirs = ["Data", "DataMX", "Quests", "QuestsMX", "Music"]

[bundle]
# Left out of the iOS bundle: the installer's redistributables and support
# files, GOG Galaxy metadata, the mod SDK (Windows tools), the Windows-only
# DLLs (Galaxy, Bink), the manual and readme, and the Direct3D 9 executable
# this config does not run.
exclude = ["__redist", "__support", "app", "commonappdata", "tmp", "SDK",
           "*.dll", "*.pdf", "*.htm", "*.url", "*.hashdb", "*.info", "*.script",
           "MajestyHD.exe"]
